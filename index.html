<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>寶可夢英文生字大冒險 ⚡</title>
  <style>
    :root {
      --poke-red: #EE1515;
      --poke-dark-red: #CC0000;
      --poke-yellow: #FFCB05;
      --poke-blue: #2A75BB;
      --poke-dark-blue: #3C5AA6;
      --poke-bg: #F4F6F9;
      --card-bg: #FFFFFF;
      --text-dark: #1E293B;
    }

    * {
      box-sizing: border-box;
      font-family: 'Fredoka', 'Segoe UI', Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 15px;
      background-color: var(--poke-bg);
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      background-image: radial-gradient(#CBD5E1 1px, transparent 1px);
      background-size: 20px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 15px;
      width: 100%;
      max-width: 800px;
    }

    .title-box {
      background: linear-gradient(135deg, var(--poke-red), var(--poke-dark-red));
      color: white;
      padding: 15px 20px;
      border-radius: 20px;
      box-shadow: 0 6px 0 #990000, 0 10px 15px rgba(0,0,0,0.15);
      border: 3px solid #000;
      display: inline-block;
      width: 100%;
    }

    h1 {
      margin: 0;
      font-size: 1.8rem;
      letter-spacing: 1px;
      text-shadow: 2px 2px 0 #000;
      color: var(--poke-yellow);
    }

    .subtitle {
      font-size: 0.95rem;
      margin-top: 5px;
      opacity: 0.9;
    }

    .tabs {
      display: flex;
      gap: 12px;
      margin: 15px 0;
      justify-content: center;
      width: 100%;
      max-width: 800px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      font-size: 1.1rem;
      font-weight: 800;
      border: 3px solid #000;
      border-radius: 16px;
      background: #E2E8F0;
      color: #475569;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 0 #000;
    }

    .tab-btn.active {
      background: var(--poke-yellow);
      color: var(--poke-dark-blue);
      box-shadow: 0 4px 0 #000;
    }

    .tab-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #000;
    }

    .view-content {
      display: none;
      width: 100%;
      max-width: 800px;
    }

    .view-content.active {
      display: block;
    }

    /* Flashcard Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 6px 0 #CBD5E1;
      border: 3px solid #000;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "🔴";
      position: absolute;
      top: 8px;
      right: 10px;
      font-size: 0.9rem;
      opacity: 0.5;
    }

    .card.sentence-card {
      grid-column: 1 / -1;
      background: #FFFBEB;
      border-color: #000;
    }

    .icon {
      font-size: 3.2rem;
      margin-bottom: 5px;
      filter: drop-shadow(0 4px 0 rgba(0,0,0,0.1));
    }

    .word {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--poke-dark-blue);
      margin-bottom: 2px;
    }

    .word-letters {
      display: flex;
      gap: 2px;
      margin-bottom: 8px;
    }

    .letter-span {
      padding: 2px 5px;
      border-radius: 6px;
      font-weight: 800;
    }

    .letter-span.active {
      background-color: var(--poke-red);
      color: white;
    }

    .translation {
      font-size: 0.95rem;
      color: #64748B;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .action-btn {
      flex: 1;
      padding: 8px 10px;
      border: 2px solid #000;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      box-shadow: 0 3px 0 #000;
      transition: all 0.1s;
    }

    .action-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #000;
    }

    .btn-read {
      background: #E0F2FE;
      color: #0284C7;
    }

    .btn-spell {
      background: #FEF3C7;
      color: #D97706;
    }

    /* Game View */
    .game-card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 25px;
      box-shadow: 0 8px 0 #000;
      border: 4px solid #000;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      position: relative;
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 1.1rem;
      font-weight: 800;
      background: #F1F5F9;
      padding: 10px 16px;
      border-radius: 12px;
      border: 2px solid #000;
    }

    .stars {
      color: var(--poke-red);
    }

    .game-icon {
      font-size: 5.5rem;
      margin: 10px 0 0 0;
      filter: drop-shadow(0 6px 0 rgba(0,0,0,0.15));
    }

    .answer-slots {
      display: flex;
      gap: 8px;
      margin: 10px 0;
      min-height: 55px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .slot {
      width: 45px;
      height: 52px;
      border-bottom: 4px solid var(--poke-dark-blue);
      font-size: 1.9rem;
      font-weight: 800;
      color: var(--poke-dark-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: lowercase;
    }

    .tiles-container {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 500px;
    }

    .tile {
      width: 48px;
      height: 52px;
      background: var(--poke-yellow);
      color: #000;
      font-size: 1.6rem;
      font-weight: 800;
      border-radius: 12px;
      border: 2px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 0 #000;
      user-select: none;
      transition: all 0.1s;
      text-transform: lowercase;
    }

    .tile:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #000;
    }

    .tile.used {
      opacity: 0.2;
      pointer-events: none;
      box-shadow: none;
      border-color: #94A3B8;
    }

    .game-controls {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }

    .game-btn {
      padding: 10px 24px;
      border: 3px solid #000;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 0 #000;
      transition: all 0.1s;
    }

    .game-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #000;
    }

    .btn-reset {
      background: #F1F5F9;
      color: #475569;
    }

    .btn-next {
      background: #2ECC71;
      color: white;
    }
  </style>
</head>
<body>

  <header>
    <div class="title-box">
      <h1>⚡ 寶可夢生字冒險 ⚡</h1>
      <div class="subtitle"> diventare大師！點擊學習生字與串字挑戰</div>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('learn')">📖 訓練圖鑑</button>
    <button class="tab-btn" onclick="switchTab('game')">🎮 捕捉挑戰</button>
  </div>

  <!-- VIEW 1: LEARN FLASHCARDS -->
  <div id="learnView" class="view-content active">
    <div class="grid" id="cardGrid"></div>
  </div>

  <!-- VIEW 2: SPELLING GAME -->
  <div id="gameView" class="view-content">
    <div class="game-card">
      <div class="game-header">
        <span id="gameProgress">捕捉進度: 1 / 10</span>
        <span class="stars" id="starCount">🔴 精靈球: 0</span>
      </div>

      <div class="game-icon" id="gameIcon">🧸</div>
      <div id="gameTranslation" style="color: #64748B; font-size: 1.1rem; font-weight: 700;"></div>

      <button class="action-btn btn-read" style="width: auto; padding: 8px 18px;" onclick="playCurrentGameWordSound()">
        🔊 聽聲音
      </button>

      <div class="answer-slots" id="answerSlots"></div>
      <div class="tiles-container" id="tilesContainer"></div>

      <div class="game-controls">
        <button class="game-btn btn-reset" onclick="resetGameWord()">🔄 清除</button>
        <button class="game-btn btn-next" id="nextBtn" style="display: none;" onclick="nextGameWord()">下一題 ➔</button>
      </div>
    </div>
  </div>

  <script>
    const vocabulary = [
      { word: "toys", icon: "🧸", translation: "玩具" },
      { word: "doll", icon: "🪆", translation: "洋娃娃" },
      { word: "car", icon: "🚗", translation: "玩具車" },
      { word: "train", icon: "🚂", translation: "火車" },
      { word: "gun", icon: "🔫", translation: "玩具槍" },
      { word: "dinosaur", icon: "🦖", translation: "恐龍" },
      { word: "bus", icon: "🚌", translation: "巴士" },
      { word: "blocks", icon: "🧱", translation: "積木" },
      { word: "plane", icon: "✈️", translation: "飛機" },
      { word: "ball", icon: "⚽", translation: "波/球" },
      { word: "This is my teddy bear.", icon: "🧸", translation: "這是我的泰迪熊。", isSentence: true },
      { word: "What colour is the robot?", icon: "🤖", translation: "機器人是什麼顏色的？", isSentence: true }
    ];

    const wordsOnly = vocabulary.filter(v => !v.isSentence);

    // 鼓勵詞句列表
    const praiseWords = ["Great!", "Well done!", "Good job!", "Nice!", "Stunning!", "Excellent!"];

    // Speech Synthesis Helper
    function speak(text, rate = 0.9) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = rate;
      window.speechSynthesis.speak(utterance);
      return utterance;
    }

    // Render Flashcards
    function renderCards() {
      const grid = document.getElementById('cardGrid');
      grid.innerHTML = '';

      vocabulary.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = `card ${item.isSentence ? 'sentence-card' : ''}`;

        const lettersHtml = item.word.split('').map((char, lIdx) => 
          `<span class="letter-span" id="span-${index}-${lIdx}">${char}</span>`
        ).join('');

        card.innerHTML = `
          <div class="icon">${item.icon}</div>
          <div class="word">
            <div class="word-letters">${lettersHtml}</div>
          </div>
          <div class="translation">${item.translation}</div>
          <div class="btn-group">
            <button class="action-btn btn-read" onclick="readWord('${item.word.replace(/'/g, "\\'")}')">
              🔊 讀音
            </button>
            ${!item.isSentence ? `
              <button class="action-btn btn-spell" onclick="spellWord(${index})">
                🔤 串字
              </button>
            ` : ''}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function readWord(text) {
      speak(text, 0.85);
    }

    // Spell Word Letter by Letter strictly pronouncing lower-case letter sounds (No "Capital")
    async function spellWord(cardIdx) {
      const item = vocabulary[cardIdx];
      const word = item.word;
      window.speechSynthesis.cancel();

      for (let i = 0; i < word.length; i++) {
        const letterSpan = document.getElementById(`span-${cardIdx}-${i}`);
        if (letterSpan) letterSpan.classList.add('active');

        // Force lowercase letter sound to prevent saying "capital"
        const cleanLetter = word[i].toLowerCase();
        
        await new Promise((resolve) => {
          const u = new SpeechSynthesisUtterance(cleanLetter);
          u.lang = 'en-US';
          u.rate = 0.7;
          u.onend = resolve;
          u.onerror = resolve;
          window.speechSynthesis.speak(u);
        });

        if (letterSpan) letterSpan.classList.remove('active');
        await new Promise(r => setTimeout(r, 100));
      }

      // Read whole word at the end
      speak(word, 0.85);
    }

    // Tab Switching
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.view-content').forEach(view => view.classList.remove('active'));

      if (tab === 'learn') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('learnView').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('gameView').classList.add('active');
        initGame();
      }
    }

    // Game Logic
    let currentGameIndex = 0;
    let pokeballs = 0;
    let currentInput = [];
    let currentScrambled = [];

    function initGame() {
      currentGameIndex = 0;
      pokeballs = 0;
      document.getElementById('starCount').textContent = `🔴 精靈球: ${pokeballs}`;
      loadGameQuestion();
    }

    function loadGameQuestion() {
      const current = wordsOnly[currentGameIndex];
      document.getElementById('gameProgress').textContent = `捕捉進度: ${currentGameIndex + 1} / ${wordsOnly.length}`;
      document.getElementById('gameIcon').textContent = current.icon;
      document.getElementById('gameTranslation').textContent = current.translation;
      document.getElementById('nextBtn').style.display = 'none';

      currentInput = [];
      
      // Prepare answer slots
      const slotsContainer = document.getElementById('answerSlots');
      slotsContainer.innerHTML = '';
      for (let i = 0; i < current.word.length; i++) {
        const slot = document.createElement('div');
        slot.className = 'slot';
        slot.id = `slot-${i}`;
        slotsContainer.appendChild(slot);
      }

      // Prepare scrambled tiles
      const letters = current.word.toLowerCase().split('');
      currentScrambled = [...letters].sort(() => Math.random() - 0.5);

      const tilesContainer = document.getElementById('tilesContainer');
      tilesContainer.innerHTML = '';
      currentScrambled.forEach((char, idx) => {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.textContent = char;
        tile.id = `tile-${idx}`;
        tile.onclick = () => selectTile(char, idx);
        tilesContainer.appendChild(tile);
      });

      playCurrentGameWordSound();
    }

    function playCurrentGameWordSound() {
      speak(wordsOnly[currentGameIndex].word, 0.85);
    }

    function selectTile(char, tileIdx) {
      const targetWord = wordsOnly[currentGameIndex].word.toLowerCase();
      if (currentInput.length >= targetWord.length) return;

      // Play clean letter sound
      speak(char.toLowerCase(), 0.9);

      currentInput.push({ char, tileIdx });
      
      // Update Slot
      const slotIndex = currentInput.length - 1;
      document.getElementById(`slot-${slotIndex}`).textContent = char;

      // Disable Tile
      document.getElementById(`tile-${tileIdx}`).classList.add('used');

      // Check Word Completion
      if (currentInput.length === targetWord.length) {
        checkAnswer();
      }
    }

    function resetGameWord() {
      currentInput = [];
      const slotsContainer = document.getElementById('answerSlots');
      Array.from(slotsContainer.children).forEach(slot => slot.textContent = '');
      
      const tilesContainer = document.getElementById('tilesContainer');
      Array.from(tilesContainer.children).forEach(tile => tile.classList.remove('used'));
    }

    function checkAnswer() {
      const targetWord = wordsOnly[currentGameIndex].word.toLowerCase();
      const userWord = currentInput.map(i => i.char).join('');

      if (userWord === targetWord) {
        pokeballs += 1;
        document.getElementById('starCount').textContent = `🔴 精靈球: ${pokeballs}`;
        
        // 隨機選取正面鼓勵字句，並且不重複讀出該生字
        const randomPraise = praiseWords[Math.floor(Math.random() * praiseWords.length)];
        speak(randomPraise, 0.95);

        document.getElementById('nextBtn').style.display = 'inline-block';
      } else {
        speak("Try again!", 0.9);
        setTimeout(resetGameWord, 800);
      }
    }

    function nextGameWord() {
      if (currentGameIndex < wordsOnly.length - 1) {
        currentGameIndex++;
        loadGameQuestion();
      } else {
        alert(`🎉 恭喜你完成所有捕捉挑戰！成功獲得 ${pokeballs} 個精靈球，成為寶可夢生字大師！`);
        initGame();
      }
    }

    // Initialize
    renderCards();
  </script>
</body>
</html>
