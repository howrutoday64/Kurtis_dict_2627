<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>字學貓樂園 🐱✨</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Fredoka:wght@600;700&display=swap');

    :root {
      --gold-light: #FFE8A3;
      --gold-primary: #DFB253;
      --gold-dark: #9A7025;
      --night-bg: #091326;
      --card-bg: rgba(15, 28, 54, 0.9);
      --border-color: #D4AF37;
      --text-gold: #FFF0C2;
      --text-white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      font-family: 'Fredoka', 'Cinzel', 'Microsoft JhengHei', sans-serif;
    }

    body {
      margin: 0;
      padding: 15px;
      background: radial-gradient(circle at center, #162447 0%, #091326 100%);
      color: var(--text-gold);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Background stars */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 40px 70px, #ffd700, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 160px 120px, #ffd700, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 200px 200px;
      opacity: 0.6;
      pointer-events: none;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      width: 100%;
      max-width: 800px;
      position: relative;
      z-index: 10;
    }

    .title-banner {
      background: linear-gradient(180deg, #1E2D4A 0%, #0F1C36 100%);
      border: 3px solid var(--gold-primary);
      border-radius: 25px;
      padding: 15px 25px;
      box-shadow: 0 0 20px rgba(223, 178, 83, 0.4), inset 0 0 15px rgba(223, 178, 83, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      position: relative;
    }

    .cat-mascot {
      font-size: 3.2rem;
      filter: drop-shadow(0 0 10px rgba(255, 232, 163, 0.8));
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      color: var(--gold-light);
      text-shadow: 0 0 10px rgba(223, 178, 83, 0.8), 2px 2px 4px #000;
      letter-spacing: 2px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #A0AEC0;
      margin-top: 4px;
    }

    .tabs {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 800px;
      z-index: 10;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      border: 2px solid var(--gold-primary);
      border-radius: 18px;
      background: linear-gradient(180deg, #1A263F 0%, #0D1629 100%);
      color: var(--text-gold);
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: linear-gradient(180deg, #DFB253 0%, #9A7025 100%);
      color: #091326;
      box-shadow: 0 0 15px rgba(223, 178, 83, 0.6);
    }

    .view-content {
      display: none;
      width: 100%;
      max-width: 800px;
      z-index: 10;
    }

    .view-content.active {
      display: block;
    }

    /* Grid Layout */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--card-bg);
      border: 2px solid var(--gold-primary);
      border-radius: 20px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5), inset 0 0 10px rgba(223, 178, 83, 0.1);
      position: relative;
    }

    /* Fix sentence card layout & line breaks */
    .card.sentence-card {
      grid-column: 1 / -1;
      background: linear-gradient(180deg, rgba(26, 42, 74, 0.95) 0%, rgba(13, 24, 46, 0.95) 100%);
      border-color: var(--gold-light);
      padding: 22px;
      text-align: center;
    }

    .card.sentence-card .word {
      font-size: 1.5rem;
      line-height: 1.6;
      word-break: break-word;
      white-space: normal;
    }

    .card.sentence-card .word-letters {
      flex-wrap: wrap;
      justify-content: center;
      row-gap: 8px;
    }

    .icon {
      font-size: 3.5rem;
      margin-bottom: 8px;
      filter: drop-shadow(0 0 8px rgba(255, 232, 163, 0.5));
    }

    .word {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--gold-light);
      margin-bottom: 4px;
      text-align: center;
    }

    .word-letters {
      display: flex;
      gap: 2px;
      margin-bottom: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .letter-span {
      padding: 2px 4px;
      border-radius: 4px;
      font-weight: bold;
      transition: background 0.15s;
    }

    .letter-span.active {
      background-color: var(--gold-primary);
      color: #091326;
    }

    .translation {
      font-size: 1rem;
      color: #CBD5E1;
      margin-bottom: 12px;
      text-align: center;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .action-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--gold-primary);
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-read {
      background: linear-gradient(180deg, #2B4C7E 0%, #1A3053 100%);
      color: var(--text-gold);
    }

    .btn-spell {
      background: linear-gradient(180deg, #8A6518 0%, #543D0A 100%);
      color: var(--gold-light);
    }

    .action-btn:active {
      transform: scale(0.96);
    }

    /* Game View */
    .game-card {
      background: var(--card-bg);
      border: 3px solid var(--gold-primary);
      border-radius: 25px;
      padding: 25px;
      box-shadow: 0 0 25px rgba(223, 178, 83, 0.3);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 1.1rem;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.05);
      padding: 10px 18px;
      border-radius: 15px;
      border: 1px solid var(--gold-dark);
    }

    .game-icon {
      font-size: 5rem;
      margin-top: 10px;
      filter: drop-shadow(0 0 15px rgba(255, 232, 163, 0.6));
    }

    .answer-slots {
      display: flex;
      gap: 8px;
      margin: 15px 0;
      min-height: 55px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .slot {
      width: 45px;
      height: 52px;
      border-bottom: 3px solid var(--gold-primary);
      font-size: 2rem;
      font-weight: bold;
      color: var(--gold-light);
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: lowercase;
    }

    .tiles-container {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 500px;
    }

    .tile {
      width: 48px;
      height: 52px;
      background: linear-gradient(180deg, #DFB253 0%, #9A7025 100%);
      color: #091326;
      font-size: 1.7rem;
      font-weight: bold;
      border-radius: 12px;
      border: 1px solid var(--gold-light);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      user-select: none;
      transition: all 0.15s;
      text-transform: lowercase;
    }

    .tile:active {
      transform: translateY(2px);
    }

    .tile.used {
      opacity: 0.25;
      pointer-events: none;
      box-shadow: none;
    }

    .game-controls {
      display: flex;
      gap: 15px;
      margin-top: 10px;
    }

    .game-btn {
      padding: 12px 28px;
      border: 2px solid var(--gold-primary);
      border-radius: 15px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-reset {
      background: rgba(255, 255, 255, 0.1);
      color: #CBD5E1;
    }

    .btn-next {
      background: linear-gradient(180deg, #2ECC71 0%, #27AE60 100%);
      color: white;
      box-shadow: 0 0 12px rgba(46, 204, 113, 0.5);
    }
  </style>
</head>
<body>

  <header>
    <div class="title-banner">
      <div class="cat-mascot">🐱✨</div>
      <div>
        <h1>字學貓樂園</h1>
        <div class="subtitle">魔法學堂：聽讀音・學串字・探索生字卡</div>
      </div>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('learn')">📖 生字卡圖鑑</button>
    <button class="tab-btn" onclick="switchTab('game')">🎮 魔法串字挑戰</button>
  </div>

  <!-- VIEW 1: LEARN FLASHCARDS -->
  <div id="learnView" class="view-content active">
    <div class="grid" id="cardGrid"></div>
  </div>

  <!-- VIEW 2: SPELLING GAME -->
  <div id="gameView" class="view-content">
    <div class="game-card">
      <div class="game-header">
        <span id="gameProgress">挑戰進度: 1 / 10</span>
        <span class="stars" id="starCount">⭐ 魔法星: 0</span>
      </div>

      <div class="game-icon" id="gameIcon">🧸</div>
      <div id="gameTranslation" style="color: var(--gold-light); font-size: 1.2rem; font-weight: bold;"></div>

      <button class="action-btn btn-read" style="width: auto; padding: 8px 22px; font-size: 1rem;" onclick="playCurrentGameWordSound()">
        🔊 聽聽發音
      </button>

      <div class="answer-slots" id="answerSlots"></div>
      <div class="tiles-container" id="tilesContainer"></div>

      <div class="game-controls">
        <button class="game-btn btn-reset" onclick="resetGameWord()">🔄 清除</button>
        <button class="game-btn btn-next" id="nextBtn" style="display: none;" onclick="nextGameWord()">下一題 ➔</button>
      </div>
    </div>
  </div>

  <script>
    const vocabulary = [
      { word: "toys", icon: "🧸", translation: "玩具" },
      { word: "doll", icon: "🪆", translation: "洋娃娃" },
      { word: "car", icon: "🚗", translation: "玩具車" },
      { word: "train", icon: "🚂", translation: "火車" },
      { word: "gun", icon: "🔫", translation: "玩具槍" },
      { word: "dinosaur", icon: "🦖", translation: "恐龍" },
      { word: "bus", icon: "🚌", translation: "巴士" },
      { word: "blocks", icon: "🧱", translation: "積木" },
      { word: "plane", icon: "✈️", translation: "飛機" },
      { word: "ball", icon: "⚽", translation: "波/球" },
      { word: "This is my teddy bear.", icon: "🧸", translation: "這是我的泰迪熊。", isSentence: true },
      { word: "What colour is the robot?", icon: "🤖", translation: "機器人是什麼顏色的？", isSentence: true }
    ];

    const praiseWords = ["Great!", "Well done!", "Good job!", "Nice!", "Stunning!", "Excellent!"];
    const wordsOnly = vocabulary.filter(v => !v.isSentence);

    // Audio helpers with Promises to ensure complete speech playback
    function speakLetterPromise(letter) {
      return new Promise((resolve) => {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(letter.toLowerCase());
        u.lang = 'en-US';
        u.rate = 0.85;
        u.onend = resolve;
        u.onerror = resolve;
        window.speechSynthesis.speak(u);
      });
    }

    function speakTextPromise(text, rate = 0.85) {
      return new Promise((resolve) => {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        u.rate = rate;
        u.onend = resolve;
        u.onerror = resolve;
        window.speechSynthesis.speak(u);
      });
    }

    // Render Cards
    function renderCards() {
      const grid = document.getElementById('cardGrid');
      grid.innerHTML = '';

      vocabulary.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = `card ${item.isSentence ? 'sentence-card' : ''}`;

        const lettersHtml = item.word.split('').map((char, lIdx) => 
          `<span class="letter-span" id="span-${index}-${lIdx}">${char}</span>`
        ).join('');

        card.innerHTML = `
          <div class="icon">${item.icon}</div>
          <div class="word">
            <div class="word-letters">${lettersHtml}</div>
          </div>
          <div class="translation">${item.translation}</div>
          <div class="btn-group">
            <button class="action-btn btn-read" onclick="readWord('${item.word.replace(/'/g, "\\'")}')">
              🔊 讀音
            </button>
            ${!item.isSentence ? `
              <button class="action-btn btn-spell" onclick="spellWord(${index})">
                🔤 串字
              </button>
            ` : ''}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function readWord(text) {
      speakTextPromise(text, 0.85);
    }

    async function spellWord(cardIdx) {
      const item = vocabulary[cardIdx];
      const word = item.word;
      window.speechSynthesis.cancel();

      for (let i = 0; i < word.length; i++) {
        const letterSpan = document.getElementById(`span-${cardIdx}-${i}`);
        if (letterSpan) letterSpan.classList.add('active');

        await speakLetterPromise(word[i]);

        if (letterSpan) letterSpan.classList.remove('active');
        await new Promise(r => setTimeout(r, 120));
      }

      await speakTextPromise(word, 0.85);
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.view-content').forEach(view => view.classList.remove('active'));

      if (tab === 'learn') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('learnView').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('gameView').classList.add('active');
        initGame();
      }
    }

    // Game Variables
    let currentGameIndex = 0;
    let stars = 0;
    let currentInput = [];
    let isChecking = false;

    function initGame() {
      currentGameIndex = 0;
      stars = 0;
      document.getElementById('starCount').textContent = `⭐ 魔法星: ${stars}`;
      loadGameQuestion();
    }

    function loadGameQuestion() {
      const current = wordsOnly[currentGameIndex];
      document.getElementById('gameProgress').textContent = `挑戰進度: ${currentGameIndex + 1} / ${wordsOnly.length}`;
      document.getElementById('gameIcon').textContent = current.icon;
      document.getElementById('gameTranslation').textContent = current.translation;
      document.getElementById('nextBtn').style.display = 'none';

      currentInput = [];
      isChecking = false;

      const slotsContainer = document.getElementById('answerSlots');
      slotsContainer.innerHTML = '';
      for (let i = 0; i < current.word.length; i++) {
        const slot = document.createElement('div');
        slot.className = 'slot';
        slot.id = `slot-${i}`;
        slotsContainer.appendChild(slot);
      }

      const letters = current.word.toLowerCase().split('');
      const scrambled = [...letters].sort(() => Math.random() - 0.5);

      const tilesContainer = document.getElementById('tilesContainer');
      tilesContainer.innerHTML = '';
      scrambled.forEach((char, idx) => {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.textContent = char;
        tile.id = `tile-${idx}`;
        tile.onclick = () => selectTile(char, idx);
        tilesContainer.appendChild(tile);
      });

      playCurrentGameWordSound();
    }

    function playCurrentGameWordSound() {
      speakTextPromise(wordsOnly[currentGameIndex].word, 0.85);
    }

    async function selectTile(char, tileIdx) {
      if (isChecking) return;

      const targetWord = wordsOnly[currentGameIndex].word.toLowerCase();
      if (currentInput.length >= targetWord.length) return;

      currentInput.push({ char, tileIdx });
      
      const slotIndex = currentInput.length - 1;
      document.getElementById(`slot-${slotIndex}`).textContent = char;
      document.getElementById(`tile-${tileIdx}`).classList.add('used');

      await speakLetterPromise(char);

      if (currentInput.length === targetWord.length) {
        isChecking = true;
        checkAnswer();
      }
    }

    function resetGameWord() {
      currentInput = [];
      isChecking = false;
      const slotsContainer = document.getElementById('answerSlots');
      Array.from(slotsContainer.children).forEach(slot => slot.textContent = '');
      
      const tilesContainer = document.getElementById('tilesContainer');
      Array.from(tilesContainer.children).forEach(tile => tile.classList.remove('used'));
    }

    async function checkAnswer() {
      const targetWord = wordsOnly[currentGameIndex].word.toLowerCase();
      const userWord = currentInput.map(i => i.char).join('');

      await new Promise(r => setTimeout(r, 150));

      if (userWord === targetWord) {
        stars += 10;
        document.getElementById('starCount').textContent = `⭐ 魔法星: ${stars}`;
        
        const randomPraise = praiseWords[Math.floor(Math.random() * praiseWords.length)];
        await speakTextPromise(randomPraise, 0.95);

        document.getElementById('nextBtn').style.display = 'inline-block';
      } else {
        await speakTextPromise("Try again!", 0.9);
        setTimeout(resetGameWord, 400);
      }
    }

    function nextGameWord() {
      if (currentGameIndex < wordsOnly.length - 1) {
        currentGameIndex++;
        loadGameQuestion();
      } else {
        alert(`🎉 恭喜完成所有魔法挑戰！獲得總星數：${stars} 顆魔法星！`);
        initGame();
      }
    }

    // Initialize
    renderCards();
  </script>
</body>
</html>
