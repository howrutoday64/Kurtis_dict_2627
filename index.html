<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>寶可夢與可愛動物生字大冒險 ⚡</title>
  <style>
    :root {
      --poke-red: #FF5350;
      --poke-yellow: #FFCE31;
      --poke-blue: #38A1F3;
      --poke-green: #2ECC71;
      --bg-color: #F0F7FF;
      --card-bg: #FFFFFF;
      --text-color: #2D3748;
    }

    * {
      box-sizing: border-box;
      font-family: 'Fredoka', 'Segoe UI', Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 15px;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      background-image: radial-gradient(#CBD5E1 1.5px, transparent 1.5px);
      background-size: 24px 24px;
    }

    header {
      text-align: center;
      margin-bottom: 15px;
      width: 100%;
      max-width: 800px;
    }

    .title-box {
      background: linear-gradient(135deg, #FF6B6B, #FF8E53);
      color: white;
      padding: 16px 20px;
      border-radius: 24px;
      box-shadow: 0 8px 0 #D93838, 0 10px 20px rgba(0,0,0,0.1);
      border: 4px solid #2D3748;
      display: inline-block;
      width: 100%;
    }

    h1 {
      margin: 0;
      font-size: 1.8rem;
      letter-spacing: 1px;
      text-shadow: 2px 2px 0 #2D3748;
      color: var(--poke-yellow);
    }

    .subtitle {
      font-size: 1rem;
      margin-top: 5px;
      font-weight: 700;
    }

    .tabs {
      display: flex;
      gap: 12px;
      margin: 15px 0;
      justify-content: center;
      width: 100%;
      max-width: 800px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      font-size: 1.1rem;
      font-weight: 800;
      border: 3px solid #2D3748;
      border-radius: 18px;
      background: #E2E8F0;
      color: #4A5568;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 5px 0 #2D3748;
    }

    .tab-btn.active {
      background: var(--poke-yellow);
      color: #2D3748;
      box-shadow: 0 5px 0 #2D3748;
    }

    .tab-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #2D3748;
    }

    .view-content {
      display: none;
      width: 100%;
      max-width: 800px;
    }

    .view-content.active {
      display: block;
    }

    /* Flashcard Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 22px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 6px 0 #CBD5E1;
      border: 3px solid #2D3748;
      position: relative;
    }

    .card.sentence-card {
      grid-column: 1 / -1;
      background: #FFFBEB;
    }

    .pokemon-badge {
      position: absolute;
      top: 10px;
      right: 12px;
      font-size: 1.2rem;
    }

    .icon {
      font-size: 3.5rem;
      margin-bottom: 5px;
      filter: drop-shadow(0 4px 0 rgba(0,0,0,0.1));
    }

    .word {
      font-size: 1.4rem;
      font-weight: 800;
      color: #2B6CB0;
      margin-bottom: 2px;
    }

    .word-letters {
      display: flex;
      gap: 2px;
      margin-bottom: 8px;
    }

    .letter-span {
      padding: 2px 5px;
      border-radius: 6px;
      font-weight: 800;
    }

    .letter-span.active {
      background-color: var(--poke-red);
      color: white;
    }

    .translation {
      font-size: 0.95rem;
      color: #718096;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .action-btn {
      flex: 1;
      padding: 8px 10px;
      border: 2px solid #2D3748;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      box-shadow: 0 3px 0 #2D3748;
      transition: all 0.1s;
    }

    .action-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #2D3748;
    }

    .btn-read {
      background: #EBF8FF;
      color: #2B6CB0;
    }

    .btn-spell {
      background: #FEFCBF;
      color: #D69E2E;
    }

    /* Game View */
    .game-card {
      background: var(--card-bg);
      border-radius: 28px;
      padding: 25px;
      box-shadow: 0 8px 0 #2D3748;
      border: 4px solid #2D3748;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      position: relative;
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 1.1rem;
      font-weight: 800;
      background: #EDF2F7;
      padding: 10px 18px;
      border-radius: 16px;
      border: 2px solid #2D3748;
    }

    .pokemon-avatar-box {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-top: 10px;
    }

    .poke-avatar {
      font-size: 3rem;
      background: #FFF5F5;
      padding: 10px;
      border-radius: 50%;
      border: 3px solid #2D3748;
      box-shadow: 0 4px 0 #2D3748;
    }

    .game-icon {
      font-size: 4.5rem;
      filter: drop-shadow(0 6px 0 rgba(0,0,0,0.15));
    }

    .answer-slots {
      display: flex;
      gap: 8px;
      margin: 10px 0;
      min-height: 55px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .slot {
      width: 45px;
      height: 52px;
      border-bottom: 4px solid #2B6CB0;
      font-size: 1.9rem;
      font-weight: 800;
      color: #2B6CB0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: lowercase;
    }

    .tiles-container {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 500px;
    }

    .tile {
      width: 48px;
      height: 52px;
      background: var(--poke-yellow);
      color: #2D3748;
      font-size: 1.6rem;
      font-weight: 800;
      border-radius: 14px;
      border: 3px solid #2D3748;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 0 #2D3748;
      user-select: none;
      transition: all 0.1s;
      text-transform: lowercase;
    }

    .tile:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #2D3748;
    }

    .tile.used {
      opacity: 0.2;
      pointer-events: none;
      box-shadow: none;
      border-color: #A0AEC0;
    }

    .game-controls {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }

    .game-btn {
      padding: 12px 24px;
      border: 3px solid #2D3748;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 0 #2D3748;
      transition: all 0.1s;
    }

    .game-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #2D3748;
    }

    .btn-reset {
      background: #EDF2F7;
      color: #4A5568;
    }

    .btn-next {
      background: var(--poke-green);
      color: white;
    }
  </style>
</head>
<body>

  <header>
    <div class="title-box">
      <h1>⚡ 寶可夢與可愛動物生字冒險 ⚡</h1>
      <div class="subtitle">🐾 一起學習英文生字，捕捉寶可夢！ 🐾</div>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('learn')">📖 圖鑑學習卡</button>
    <button class="tab-btn" onclick="switchTab('game')">🎮 精靈球捕捉挑戰</button>
  </div>

  <!-- VIEW 1: LEARN FLASHCARDS -->
  <div id="learnView" class="view-content active">
    <div class="grid" id="cardGrid"></div>
  </div>

  <!-- VIEW 2: SPELLING GAME -->
  <div id="gameView" class="view-content">
    <div class="game-card">
      <div class="game-header">
        <span id="gameProgress">捕捉進度: 1 / 10</span>
        <span class="stars" id="starCount">🔴 精靈球: 0</span>
      </div>

      <div class="pokemon-avatar-box">
        <div class="poke-avatar" id="pokePartner">⚡</div>
        <div class="game-icon" id="gameIcon">🧸</div>
      </div>

      <div id="gameTranslation" style="color: #4A5568; font-size: 1.15rem; font-weight: 800;"></div>

      <button class="action-btn btn-read" style="width: auto; padding: 8px 20px; font-size: 1rem;" onclick="playCurrentGameWordSound()">
        🔊 聽聽發音
      </button>

      <div class="answer-slots" id="answerSlots"></div>
      <div class="tiles-container" id="tilesContainer"></div>

      <div class="game-controls">
        <button class="game-btn btn-reset" onclick="resetGameWord()">🔄 重來</button>
        <button class="game-btn btn-next" id="nextBtn" style="display: none;" onclick="nextGameWord()">下一題 ➔</button>
      </div>
    </div>
  </div>

  <script>
    const vocabulary = [
      { word: "toys", icon: "🧸", translation: "玩具", pokemon: "皮卡丘 ⚡" },
      { word: "doll", icon: "🪆", translation: "洋娃娃", pokemon: "伊布 🦊" },
      { word: "car", icon: "🚗", translation: "玩具車", pokemon: "小火龍 🐉" },
      { word: "train", icon: "🚂", translation: "火車", pokemon: "傑尼龜 🐢" },
      { word: "gun", icon: "🔫", translation: "玩具槍", pokemon: "妙蛙種子 🍃" },
      { word: "dinosaur", icon: "🦖", translation: "恐龍", pokemon: "卡比獸 🐻" },
      { word: "bus", icon: "🚌", translation: "巴士", pokemon: "胖丁 🎤" },
      { word: "blocks", icon: "🧱", translation: "積木", pokemon: "可達鴨 🦆" },
      { word: "plane", icon: "✈️", translation: "飛機", pokemon: "波克比 🥚" },
      { word: "ball", icon: "⚽", translation: "波/球", pokemon: "喵喵 🐱" },
      { word: "This is my teddy bear.", icon: "🧸", translation: "這是我的泰迪熊。", isSentence: true, pokemon: "皮卡丘 ⚡" },
      { word: "What colour is the robot?", icon: "🤖", translation: "機器人是什麼顏色的？", isSentence: true, pokemon: "伊布 🦊" }
    ];

    const pokemonPartners = ["⚡", "🦊", "🐉", "🐢", "🍃", "🐻", "🎤", "🦆", "🥚", "🐱"];
    const praiseWords = ["Great!", "Well done!", "Good job!", "Nice!", "Stunning!", "Excellent!"];
    const wordsOnly = vocabulary.filter(v => !v.isSentence);

    // Single letter audio promise to guarantee speech completion
    function speakLetterPromise(letter) {
      return new Promise((resolve) => {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(letter.toLowerCase());
        u.lang = 'en-US';
        u.rate = 0.85;
        u.onend = resolve;
        u.onerror = resolve;
        window.speechSynthesis.speak(u);
      });
    }

    function speakTextPromise(text, rate = 0.85) {
      return new Promise((resolve) => {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        u.rate = rate;
        u.onend = resolve;
        u.onerror = resolve;
        window.speechSynthesis.speak(u);
      });
    }

    // Render Flashcards
    function renderCards() {
      const grid = document.getElementById('cardGrid');
      grid.innerHTML = '';

      vocabulary.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = `card ${item.isSentence ? 'sentence-card' : ''}`;

        const lettersHtml = item.word.split('').map((char, lIdx) => 
          `<span class="letter-span" id="span-${index}-${lIdx}">${char}</span>`
        ).join('');

        card.innerHTML = `
          <div class="pokemon-badge">${item.pokemon.split(' ')[1]}</div>
          <div class="icon">${item.icon}</div>
          <div class="word">
            <div class="word-letters">${lettersHtml}</div>
          </div>
          <div class="translation">${item.translation}</div>
          <div class="btn-group">
            <button class="action-btn btn-read" onclick="readWord('${item.word.replace(/'/g, "\\'")}')">
              🔊 讀音
            </button>
            ${!item.isSentence ? `
              <button class="action-btn btn-spell" onclick="spellWord(${index})">
                🔤 串字
              </button>
            ` : ''}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function readWord(text) {
      speakTextPromise(text, 0.85);
    }

    // Spell Word Letter by Letter strictly pronouncing lower-case letter sounds (No "Capital")
    async function spellWord(cardIdx) {
      const item = vocabulary[cardIdx];
      const word = item.word;
      window.speechSynthesis.cancel();

      for (let i = 0; i < word.length; i++) {
        const letterSpan = document.getElementById(`span-${cardIdx}-${i}`);
        if (letterSpan) letterSpan.classList.add('active');

        await speakLetterPromise(word[i]);

        if (letterSpan) letterSpan.classList.remove('active');
        await new Promise(r => setTimeout(r, 120));
      }

      // Read whole word after all letters finish
      await speakTextPromise(word, 0.85);
    }

    // Tab Switching
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.view-content').forEach(view => view.classList.remove('active'));

      if (tab === 'learn') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('learnView').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('gameView').classList.add('active');
        initGame();
      }
    }

    // Game Logic
    let currentGameIndex = 0;
    let pokeballs = 0;
    let currentInput = [];
    let isChecking = false;

    function initGame() {
      currentGameIndex = 0;
      pokeballs = 0;
      document.getElementById('starCount').textContent = `🔴 精靈球: ${pokeballs}`;
      loadGameQuestion();
    }

    function loadGameQuestion() {
      const current = wordsOnly[currentGameIndex];
      document.getElementById('gameProgress').textContent = `捕捉進度: ${currentGameIndex + 1} / ${wordsOnly.length}`;
      document.getElementById('pokePartner').textContent = pokemonPartners[currentGameIndex % pokemonPartners.length];
      document.getElementById('gameIcon').textContent = current.icon;
      document.getElementById('gameTranslation').textContent = current.translation;
      document.getElementById('nextBtn').style.display = 'none';

      currentInput = [];
      isChecking = false;

      // Prepare answer slots
      const slotsContainer = document.getElementById('answerSlots');
      slotsContainer.innerHTML = '';
      for (let i = 0; i < current.word.length; i++) {
        const slot = document.createElement('div');
        slot.className = 'slot';
        slot.id = `slot-${i}`;
        slotsContainer.appendChild(slot);
      }

      // Prepare scrambled tiles
      const letters = current.word.toLowerCase().split('');
      const scrambled = [...letters].sort(() => Math.random() - 0.5);

      const tilesContainer = document.getElementById('tilesContainer');
      tilesContainer.innerHTML = '';
      scrambled.forEach((char, idx) => {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.textContent = char;
        tile.id = `tile-${idx}`;
        tile.onclick = () => selectTile(char, idx);
        tilesContainer.appendChild(tile);
      });

      playCurrentGameWordSound();
    }

    function playCurrentGameWordSound() {
      speakTextPromise(wordsOnly[currentGameIndex].word, 0.85);
    }

    async function selectTile(char, tileIdx) {
      if (isChecking) return;

      const targetWord = wordsOnly[currentGameIndex].word.toLowerCase();
      if (currentInput.length >= targetWord.length) return;

      currentInput.push({ char, tileIdx });
      
      // Fill Slot & Disable Tile
      const slotIndex = currentInput.length - 1;
      document.getElementById(`slot-${slotIndex}`).textContent = char;
      document.getElementById(`tile-${tileIdx}`).classList.add('used');

      // Play the single letter sound
      await speakLetterPromise(char);

      // ONLY when the user completes ALL letters of the word, trigger checkAnswer
      if (currentInput.length === targetWord.length) {
        isChecking = true;
        checkAnswer();
      }
    }

    function resetGameWord() {
      currentInput = [];
      isChecking = false;
      const slotsContainer = document.getElementById('answerSlots');
      Array.from(slotsContainer.children).forEach(slot => slot.textContent = '');
      
      const tilesContainer = document.getElementById('tilesContainer');
      Array.from(tilesContainer.children).forEach(tile => tile.classList.remove('used'));
    }

    async function checkAnswer() {
      const targetWord = wordsOnly[currentGameIndex].word.toLowerCase();
      const userWord = currentInput.map(i => i.char).join('');

      // Extra delay buffer to guarantee 100% full word spelling completion before praising
      await new Promise(r => setTimeout(r, 150));

      if (userWord === targetWord) {
        pokeballs += 1;
        document.getElementById('starCount').textContent = `🔴 精靈球: ${pokeballs}`;
        
        // Praise ONLY AFTER complete word spelled correctly
        const randomPraise = praiseWords[Math.floor(Math.random() * praiseWords.length)];
        await speakTextPromise(randomPraise, 0.95);

        document.getElementById('nextBtn').style.display = 'inline-block';
      } else {
        await speakTextPromise("Try again!", 0.9);
        setTimeout(resetGameWord, 400);
      }
    }

    function nextGameWord() {
      if (currentGameIndex < wordsOnly.length - 1) {
        currentGameIndex++;
        loadGameQuestion();
      } else {
        alert(`🎉 恭喜完成所有挑戰！成功收集 ${pokeballs} 個精靈球，成為寶可夢生字大師！`);
        initGame();
      }
    }

    // Initialize
    renderCards();
  </script>
</body>
</html>
